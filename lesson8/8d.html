<!DOCTYPE html>
<html>
<head>
    <title>8d - Sign Up</title>

    <style>
        .signup {
            width: 480px;
            padding: 20px;
        }

        input {
            box-sizing: border-box;
            padding: 18px;
            font-size: 20px;
            border: 2px solid #ddd;
            border-radius: 12px;
        }

        .name {
            width: 49%;
        }

        .email {
            width: 100%;
            margin-top: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 20px;
            background-color: #3478e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup">

    <input class="name" type="text" placeholder="First name">

    <input class="name" type="text" placeholder="First name">

    <input class="email" type="email" placeholder="Email">

    <button>Sign Up</button>

</div>

</body>
</html>
