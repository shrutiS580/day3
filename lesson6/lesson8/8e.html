<!DOCTYPE html>
<html>
<head>
    <title>8e - Uber Request</title>

    <style>
        .uber {
            width: 500px;
            padding: 20px;
            font-family: Arial;
        }

        h1 {
            font-size: 45px;
            font-weight: normal;
        }

        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
            margin-bottom: 12px;
            border: none;
            background-color: #eeeeee;
            font-size: 18px;
        }

        button {
            padding: 18px 30px;
            border: none;
            font-size: 18px;
            margin-top: 35px;
        }

        .request {
            background-color: black;
            color: white;
        }

        .schedule {
            margin-left: 25px;
        }
    </style>
</head>

<body>

<div class="uber">

    <h1>Request a ride now</h1>

    <input type="text" placeholder="Enter pickup location">

    <input type="text" placeholder="Enter destination">

    <button class="request">Request now</button>

    <button class="schedule">Schedule for later</button>

</div>

</body>
</html>
